type: object
properties:
  environment:
    $ref: ./ExecutionEnvironmentSpec.yml
  code:
    type: string
  language:
    type: string
    default: generic
  version:
    type: string
  max_retries:
    type: integer
    format: int4
    default: 5
  timeout:
    type: integer
    format: int32
    default: 180
  cmdLineArgs:
    type: string
  compilerArgs:
    type: string
  command:
    type: string
  files:
    type: array
    items:
      type: object
      properties:
        name:
          type: string
        content:
          type: string
      required:
        - name
        - content
  input:
    type: string
  extension:
    type: string
