get:
  summary: Get version
  description: Get version
  operationId: getVersion
  security:
    - xAuthToken: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - version
            properties:
              version:
                type: string
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
