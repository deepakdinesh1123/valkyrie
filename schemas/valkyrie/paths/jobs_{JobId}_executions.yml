get:
  summary: Get executions of given job
  description: Get executions of given job
  operationId: getExecutionsForJob
  parameters:
    - name: JobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    - $ref: ../components/parameters/Cursor.yml
    - $ref: ../components/parameters/Limit.yml
  security:
    - xAuthToken: []
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            required:
              - executions
              - pagination
            properties:
              executions:
                type: array
                items:
                  $ref: ../components/schemas/ExecutionResult.yml
              pagination:
                $ref: ../components/schemas/PaginationResponse.yml
    '400':
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '403':
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
    '404':
      description: Execution job not found
    '500':
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Error.yml
